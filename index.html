document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eight:1.6;\">\uc720\ud29c\ube0c\u00b7\ud2f1\ud1a1\u00b7\uc778\uc2a4\ud0c0\uadf8\ub7a8\uc5d0 \uc544\ub798 \ud574\uc2dc\ud0dc\uadf8\ub97c \ub2ec\uace0 SUNO \uacc4\uc815\uc744 \uc5b8\uae09\ud574 \uc8fc\uc138\uc694.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:8px;\">\n          <span style=\"color:#A234C7; font-weight:700; font-size:14px;\">4<\u002Fspan>\n          <span style=\"font-size:18px; font-weight:700;\">\uc20f\ud3fc URL \uc81c\ucd9c<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"color:rgba(255,255,255,0.55); font-size:14px; line-height:1.6;\">\uc5c5\ub85c\ub4dc\ud55c \ub9c1\ud06c\ub97c \uc544\ub798 \uc9c0\uc6d0\uc11c\uc5d0 \uc791\uc131 \ud6c4 \uc81c\ucd9c\ud558\uba74 \ucc38\uac00\uac00 \uc644\ub8cc\ub3fc\uc694.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:56px; border:1px solid #A234C7; border-radius:16px; padding:26px; display:inline-flex; flex-direction:column; gap:6px; align-items:center; background:rgba(255,255,255,0.03);\">\n      <div style=\"font-size:13px; color:rgba(255,255,255,0.5);\">\ud544\uc218 \ud574\uc2dc\ud0dc\uadf8 \u00b7 \ud544\uc218 \uc5b8\uae09 \uacc4\uc815<\u002Fdiv>\n      <div style=\"display:flex; gap:10px; flex-wrap:wrap; justify-content:center;\">\n        <button sc-camel-on-click=\"{{ copyHashtag }}\" style=\"background:rgba(162,52,199,0.12); border:1px solid #A234C7; color:#A234C7; font-size:16px; font-weight:700; padding:10px 18px; border-radius:999px; cursor:pointer;\">{{ hashtagLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ copyMention }}\" style=\"background:rgba(162,52,199,0.12); border:1px solid #A234C7; color:#A234C7; font-size:16px; font-weight:700; padding:10px 18px; border-radius:999px; cursor:pointer;\">{{ mentionLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:12px; color:rgba(255,255,255,0.4);\">\ud0dc\uadf8\ub97c \ud074\ub9ad\ud558\uba74 \ubcf5\uc0ac\ub3fc\uc694!<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n  <section id=\"schedule\" style=\"max-width:1100px; margin:0 auto; padding:110px 24px; text-align:center;\">\n    <div style=\"font-family:'Paperlogy', sans-serif; color:#A234C7; font-size:13px; letter-spacing:3px; font-weight:700; margin-bottom:16px;\">CONTEST SCHEDULE<\u002Fdiv>\n    <h2 style=\"font-family:'Paperlogy', sans-serif; margin:0 0 64px; font-size:clamp(28px, 4.2vw, 42px); font-weight:700;\">\ucf58\ud14c\uc2a4\ud2b8 \uc77c\uc815<\u002Fh2>\n    <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:24px; width:100%; max-width:520px; margin:0 auto; background:rgba(255,255,255,0.06); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.12); border-radius:24px; padding:48px 40px; box-sizing:border-box;\">\n      <div style=\"width:100%; text-align:center;\">\n        <div style=\"font-size:14px; font-weight:700; color:#A234C7; margin-bottom:10px; text-align:center;\">\ucc38\uac00 \uae30\uac04<\u002Fdiv>\n        <div style=\"font-size:19px; font-weight:700; margin-bottom:6px; text-align:center;\">2026.08.03(\uc6d4) \u2014 08.28(\uae08)<\u002Fdiv>\n        <div style=\"color:rgba(255,255,255,0.5); font-size:13px; text-align:center;\">\ub9c8\uac10 08.28(\uae08) 23:59 KST<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:100%; height:1px; background:rgba(255,255,255,0.12);\"><\u002Fdiv>\n      <div style=\"width:100%; text-align:center;\">\n        <div style=\"font-size:14px; font-weight:700; color:#A234C7; margin-bottom:10px; text-align:center;\">\uacb0\uacfc \ubc1c\ud45c<\u002Fdiv>\n        <div style=\"font-size:19px; font-weight:700; margin-bottom:6px; text-align:center;\">2026.09.04(\uae08)<\u002Fdiv>\n        <div style=\"color:rgba(255,255,255,0.5); font-size:13px; text-align:center;\">\uac1c\ubcc4 \uc774\uba54\uc77c \uc548\ub0b4 \ubc0f SUNO \uacf5\uc2dd \ud648\ud398\uc774\uc9c0 \uacf5\uc9c0<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:100%; height:1px; background:rgba(255,255,255,0.12);\"><\u002Fdiv>\n      <div style=\"width:100%; text-align:center;\">\n        <div style=\"font-size:14px; font-weight:700; color:#A234C7; margin-bottom:10px; text-align:center;\">\ubcf4\uc0c1 \uc9c0\uae09<\u002Fdiv>\n        <div style=\"font-size:19px; font-weight:700; margin-bottom:6px; text-align:center;\">\ubc1c\ud45c\uc77c\ub85c\ubd80\ud130 7\uc77c \uc774\ub0b4<\u002Fdiv>\n        <div style=\"color:rgba(255,255,255,0.5); font-size:13px; text-align:center;\">\ucc38\uac00\uc790 \uc804\uc6d0 \ubcf4\uc0c1 \ud06c\ub808\ub527\uc740 \ubc1c\ud45c\uc77c\ub85c\ubd80\ud130 \uc601\uc5c5\uc77c \uae30\uc900 3\uc77c \uc774\ub0b4 \uc9c0\uae09 \uc608\uc815<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<section style=\"max-width:880px; margin:0 auto; padding:110px 24px;\">\n    <div style=\"text-align:center; font-family:'Paperlogy', sans-serif; color:#A234C7; font-size:13px; letter-spacing:3px; font-weight:700; margin-bottom:16px;\">NOTICE<\u002Fdiv>\n    <h2 style=\"font-family:'Paperlogy', sans-serif; text-align:center; margin:0 0 16px; font-size:clamp(24px, 3.6vw, 34px); font-weight:700;\">\uc8fc\uc758\uc0ac\ud56d \uc548\ub0b4<\u002Fh2>\n    <p style=\"text-align:center; margin:0 0 56px; color:rgba(255,255,255,0.55); font-size:15px;\">\uc544\ub798 \ub0b4\uc6a9\uc744 \ud655\uc778\ud558\uc9c0 \uc54a\uc73c\uba74 \ucc38\uac00\uac00 \ubb34\ud6a8 \ucc98\ub9ac\ub420 \uc218 \uc788\uc73c\ub2c8 \uc720\uc758\ud574 \uc8fc\uc138\uc694.<\u002Fp>\n    <div style=\"display:flex; flex-direction:column; gap:32px;\">\n      <div style=\"background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:18px; padding:28px 32px;\">\n        <div style=\"font-weight:700; font-size:17px; margin-bottom:14px;\">\u26a0 \ucc38\uc5ec \uc81c\ud55c \uaddc\uc815<\u002Fdiv>\n        <ul style=\"margin:0; padding-left:20px; color:rgba(255,255,255,0.6); font-size:14px; line-height:1.9;\">\n          <li>\ucf58\ud14c\uc2a4\ud2b8 \ucc38\uac00\ub294 1\uc778 3\ud68c\ub85c \uc81c\ud55c\ub3fc\uc694. (4\uac74 \uc774\uc0c1 \uc811\uc218 \uc2dc \uba3c\uc800 \uc81c\ucd9c\ub41c 3\uac74 \uae30\uc900 \uc2ec\uc0ac)<\u002Fli>\n          <li>\uacc4\uc815\uc744 \ub098\ub220 \uc911\ubcf5 \ucc38\uac00\ud558\ub294 \uacbd\uc6b0, \uc81c\ucd9c\ud55c \uc804\uccb4 \uac74\uc774 \uc2e4\uaca9 \ucc98\ub9ac\ub3fc\uc694.<\u002Fli>\n          <li>\ube44\uacf5\uac1c \uacc4\uc815\uc5d0 \uc5c5\ub85c\ub4dc\ub41c \uac8c\uc2dc\ubb3c, \ud544\uc218 \ud574\uc2dc\ud0dc\uadf8 \uc785\ub825 \ubc0f \uacf5\uc2dd\uacc4\uc815 \uc5b8\uae09 \ub204\ub77d \uc2dc \uc2ec\uc0ac \ub300\uc0c1\uc5d0\uc11c \uc81c\uc678\ub3fc\uc694.<\u002Fli>\n          <li>\uc2ec\uc0ac \uc644\ub8cc \uc804 \uac8c\uc2dc\ubb3c \uc0ad\uc81c \uc2dc \ubb34\ud6a8 \ucc98\ub9ac\ub3fc\uc694. \ubc1c\ud45c\uc77c\uae4c\uc9c0 \uac8c\uc2dc\ubb3c\uc744 \uc0ad\uc81c\ud558\uc9c0 \ub9d0\uace0 \uc720\uc9c0\ud574 \uc8fc\uc138\uc694.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:18px; padding:28px 32px;\">\n        <div style=\"font-weight:700; font-size:17px; margin-bottom:14px;\">\u00a9 \uc800\uc791\uad8c \uc548\ub0b4<\u002Fdiv>\n        <ul style=\"margin:0; padding-left:20px; color:rgba(255,255,255,0.6); font-size:14px; line-height:1.9;\">\n          <li>\ucc38\uac00\uc791\uc758 \uc800\uc791\uad8c\uc740 \ucc3d\uc791\uc790 \ubcf8\uc778\uc5d0\uac8c \uadc0\uc18d\ub3fc\uc694.<\u002Fli>\n          <li>\uc8fc\ucd5c\uc0ac\ub294 \ucea0\ud398\uc778 \ud64d\ubcf4\u00b7\uc544\uce74\uc774\ube59 \ubaa9\uc801\uc5d0 \ud55c\ud574 \ucc38\uac00\uc791\uc744 \ube44\ub3c5\uc810\uc801\uc73c\ub85c \ud65c\uc6a9\ud560 \uc218 \uc788\uc5b4\uc694. (\ud06c\ub808\ub527 \ud45c\uae30 \uc6d0\uce59 \uc900\uc218)<\u002Fli>\n          <li>\uc218\ub178\ub85c \uc0dd\uc131\ud55c \uc74c\uc6d0\uc758 \uc0c1\uc5c5\uc801 \uc774\uc6a9 \ubc94\uc704\ub294 \uac00\uc785 \uc694\uae08\uc81c \uc57d\uad00\uc744 \ub530\ub77c\uc694.<\u002Fli>\n          <li>\ud0c0\uc778\uc758 \uc74c\uc6d0\u00b7\uc601\uc0c1\u00b7\uc774\ubbf8\uc9c0\ub97c \ubb34\ub2e8 \uc0ac\uc6a9\ud55c \uc218\uc0c1\uc791\uc740 \uc218\uc0c1 \ucde8\uc18c \ucc98\ub9ac\ub420 \uc218 \uc788\uc5b4\uc694.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" style=\"max-width:880px; margin:0 auto; padding:110px 24px;\">\n    <div style=\"text-align:center; font-family:'Paperlogy', sans-serif; color:#A234C7; font-size:13px; letter-spacing:3px; font-weight:700; margin-bottom:16px;\">FAQ<\u002Fdiv>\n    <h2 style=\"font-family:'Paperlogy', sans-serif; text-align:center; margin:0 0 64px; font-size:clamp(28px, 4.2vw, 42px); font-weight:700;\">\uc790\uc8fc \ubb3b\ub294 \uc9c8\ubb38<\u002Fh2>\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"7\">\n        <div style=\"border:1px solid rgba(255,255,255,0.12); border-radius:16px; overflow:hidden; background:rgba(255,255,255,0.03);\">\n          <div sc-camel-on-click=\"{{ item.toggle }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; padding:22px 26px; cursor:pointer;\">\n            <div style=\"font-weight:700; font-size:16px;\">{{ item.q }}<\u002Fdiv>\n            <div style=\"flex-shrink:0; width:24px; height:24px; border-radius:50%; border:1px solid #A234C7; color:#A234C7; display:flex; align-items:center; justify-content:center; font-size:15px;\">{{ item.sign }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ item.open }}\">\n            <div style=\"padding:0 26px 24px; color:rgba(255,255,255,0.6); font-size:14px; line-height:1.7;\">{{ item.a }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:56px;\">\n      <div style=\"font-weight:700; font-size:14px; margin-bottom:14px; color:rgba(255,255,255,0.65);\">\uc720\uc758\uc0ac\ud56d<\u002Fdiv>\n      <ul style=\"margin:0; padding-left:20px; color:rgba(255,255,255,0.45); font-size:13px; line-height:1.9;\">\n        <li>\ubcf8 \uc774\ubca4\ud2b8\ub294 \uc8fc\ucd5c\uc0ac \uc0ac\uc815\uc5d0 \ub530\ub77c \uc0ac\uc804 \uace0\uc9c0 \uc5c6\uc774 \uc77c\uc815 \ubc0f \ub0b4\uc6a9\uc774 \ubcc0\uacbd\ub418\uac70\ub098 \uc870\uae30 \uc885\ub8cc\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.<\u002Fli>\n        <li>\uc218\uc9d1\ub41c \uac1c\uc778\uc815\ubcf4\ub294 \ucea0\ud398\uc778 \uc6b4\uc601 \ubc0f \ubcf4\uc0c1 \uc9c0\uae09 \ubaa9\uc801\uc73c\ub85c\ub9cc \uc0ac\uc6a9\ub418\uba70, \uc885\ub8cc \ud6c4 3\uac1c\uc6d4 \ub0b4 \ud30c\uae30\ub429\ub2c8\ub2e4.<\u002Fli>\n        <li>\uc9c0\uc6d0\uc11c \uc791\uc131 \uc2dc \uc785\ub825\ud55c \uc774\uba54\uc77c\uc774 \uc815\ud655\ud558\uc9c0 \uc54a\uc544 \ubc1c\uc0dd\ud558\ub294 \ubcf4\uc0c1 \ubbf8\uc9c0\uae09\uc5d0 \ub300\ud574\uc11c\ub294 \uc8fc\ucd5c\uc0ac\uac00 \ucc45\uc784\uc9c0\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.<\u002Fli>\n        <li>\ub3d9\uc77c\uc778\uc774 \ubcf5\uc218 \uacc4\uc815\uc73c\ub85c \ucc38\uac00\ud55c \uc0ac\uc2e4\uc774 \ud655\uc778\ub418\uba74 \uc81c\ucd9c \uc2dc\uc810\uacfc \uad00\uacc4\uc5c6\uc774 \uc804\uac74 \uc2e4\uaca9 \ucc98\ub9ac\ub429\ub2c8\ub2e4.<\u002Fli>\n        <li>\ubd88\ubc95\u00b7\ud610\uc624\u00b7\uc120\uc815\uc801 \ucf58\ud150\uce20, \ud0c0\uc778\uc758 \uad8c\ub9ac\ub97c \uce68\ud574\ud558\ub294 \ucf58\ud150\uce20\ub294 \uc0ac\uc804 \ud1b5\ubcf4 \uc5c6\uc774 \ucc38\uac00\uac00 \ucde8\uc18c\ub429\ub2c8\ub2e4.<\u002Fli>\n        <li>\uc9c0\uae09\ub41c \ud06c\ub808\ub527\uacfc \uc774\uc6a9\uad8c\uc740 \ud0c0\uc778\uc5d0\uac8c \uc591\ub3c4\ud558\uac70\ub098 \uc7ac\ud310\ub9e4\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.<\u002Fli>\n        <li>\uc218\uc0c1\uc790\ub294 \uc81c\uc138\uacf5\uacfc\uae08 \ubd80\ub2f4 \ub300\uc0c1\uc774 \uc544\ub2c8\uba70, \ud06c\ub808\ub527 \ubc0f \uc774\uc6a9\uad8c\uc740 \ud604\uae08\uc73c\ub85c \ud658\uae09\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.<\u002Fli>\n        <li>\uc81c\ucd9c\ud55c \uc601\uc0c1\uc758 \ucd08\uc0c1\uad8c \ubc0f \ud0c0\uc778\uc758 \uad8c\ub9ac \uce68\ud574\ub85c \uc778\ud574 \ubc1c\uc0dd\ud558\ub294 \ubaa8\ub4e0 \ubc95\uc801 \ucc45\uc784\uc740 \ucf58\ud150\uce20 \uc81c\uc791\uc790(\ucc38\uac00\uc790)\uc5d0\uac8c \uc788\uc73c\uba70, \ub2f9\uc0ac\ub294 \uc774\uc640 \uad00\ub828\ud55c \uc5b4\ub5a0\ud55c \ucc45\uc784\ub3c4 \uc9c0\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.<\u002Fli>\n        <li>\uae30\ud0c0 \ubb38\uc758\ub294 support@sunokorea.com\uc73c\ub85c \uc811\uc218\ud574 \uc8fc\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"entry\" style=\"max-width:640px; margin:0 auto; padding:110px 24px;\">\n    <div style=\"text-align:center; font-family:'Paperlogy', sans-serif; color:#A234C7; font-size:13px; letter-spacing:3px; font-weight:700; margin-bottom:16px;\">ENTRY FORM<\u002Fdiv>\n    <h2 style=\"font-family:'Paperlogy', sans-serif; text-align:center; margin:0 0 16px; font-size:clamp(28px, 4.2vw, 38px); font-weight:700;\">\uc9c0\uc6d0\uc11c \uc791\uc131<\u002Fh2>\n    <p style=\"text-align:center; margin:0 0 56px; color:rgba(255,255,255,0.55); font-size:14px;\">\uc601\uc0c1\uc744 \uba3c\uc800 \uc5c5\ub85c\ub4dc\ud55c \ub4a4, \ub9c1\ud06c\ub97c \ub4f1\ub85d\ud574 \uc8fc\uc138\uc694. \uc81c\ucd9c \uc989\uc2dc \uc751\ubaa8\uac00 \uc644\ub8cc\ub3fc\uc694.<\u002Fp>\n    <form style=\"display:flex; flex-direction:column; gap:24px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:24px; padding:40px;\">\n      <div>\n        <label style=\"display:block; font-size:14px; font-weight:700; margin-bottom:8px;\">\uc774\ub984 *<\u002Flabel>\n        <input type=\"text\" placeholder=\"\uae40\ub538\uae4d\" style=\"width:100%; box-sizing:border-box; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); color:#ffffff; font-size:15px; padding:13px 16px; border-radius:12px; outline:none;\" style-focus=\"border-color: #A234C7;\">\n      <\u002Fdiv>\n      <div>\n        <label style=\"display:block; font-size:14px; font-weight:700; margin-bottom:8px;\">\uc774\uba54\uc77c *<\u002Flabel>\n        <input type=\"email\" placeholder=\"you@example.com\" style=\"width:100%; box-sizing:border-box; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); color:#ffffff; font-size:15px; padding:13px 16px; border-radius:12px; outline:none;\" style-focus=\"border-color: #A234C7;\">\n      <\u002Fdiv>\n      <div>\n        <label style=\"display:block; font-size:14px; font-weight:700; margin-bottom:4px;\">\uc751\ubaa8\uc791 URL *<\u002Flabel>\n        <div style=\"font-size:12px; color:rgba(255,255,255,0.4); margin-bottom:12px;\">\ucd5c\uc18c 1\uac1c\ub294 \ud544\uc218, \ucd5c\ub300 3\uac1c\uae4c\uc9c0 \ub4f1\ub85d\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4. (1\uc778 3\ud68c \uc751\ubaa8 \uc81c\ud55c)<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px;\">\n          <input type=\"text\" placeholder=\"URL 1 * \u2014 https:\u002F\u002F...\" style=\"width:100%; box-sizing:border-box; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); color:#ffffff; font-size:15px; padding:13px 16px; border-radius:12px; outline:none;\" style-focus=\"border-color: #A234C7;\">\n          <input type=\"text\" placeholder=\"URL 2 (\uc120\ud0dd) \u2014 https:\u002F\u002F...\" style=\"width:100%; box-sizing:border-box; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); color:#ffffff; font-size:15px; padding:13px 16px; border-radius:12px; outline:none;\" style-focus=\"border-color: #A234C7;\">\n          <input type=\"text\" placeholder=\"URL 3 (\uc120\ud0dd) \u2014 https:\u002F\u002F...\" style=\"width:100%; box-sizing:border-box; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); color:#ffffff; font-size:15px; padding:13px 16px; border-radius:12px; outline:none;\" style-focus=\"border-color: #A234C7;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <label style=\"display:flex; align-items:flex-start; gap:10px; font-size:13px; color:rgba(255,255,255,0.6); line-height:1.6;\">\n        <input type=\"checkbox\" style=\"margin-top:3px;\">\n        [\ud544\uc218] \uc751\ubaa8\uc791\uc774 SUNO\uc758 \ub9c8\ucf00\ud305 \ubc0f \ud64d\ubcf4\uc5d0 \ud65c\uc6a9\ub420 \uc218 \uc788\uc74c\uc5d0 \ub3d9\uc758\ud569\ub2c8\ub2e4<br>(\ube44\ub3d9\uc758 \uc2dc, \ucf58\ud14c\uc2a4\ud2b8 \ucc38\uac00 \ubd88\uac00)\n      <\u002Flabel>\n      <label style=\"display:flex; align-items:flex-start; gap:10px; font-size:13px; color:rgba(255,255,255,0.6); line-height:1.6;\">\n        <input type=\"checkbox\" style=\"margin-top:3px;\">\n        [\ud544\uc218] \uac1c\uc778\uc815\ubcf4 \uc218\uc9d1 \ubc0f \uc774\uc6a9\uc5d0 \ub3d9\uc758\ud569\ub2c8\ub2e4<br>(\uc218\uc9d1 \ud56d\ubaa9: \uc774\ub984, \uc774\uba54\uc77c \u002F \ubaa9\uc801: \ucf58\ud14c\uc2a4\ud2b8 \uc6b4\uc601 \ubc0f \ubcf4\uc0c1 \uc9c0\uae09 \u002F \ubcf4\uc720\uae30\uac04: \uc885\ub8cc \ud6c4 3\uac1c\uc6d4<br>\ube44\ub3d9\uc758 \uc2dc \ucc38\uac00 \ubd88\uac00)\n      <\u002Flabel>\n      <button type=\"submit\" style=\"background:linear-gradient(90deg, #FE9800, #A234C7); color:#0a0a0a; border:none; font-size:16px; font-weight:700; padding:16px; border-radius:999px; cursor:pointer;\" style-hover=\"filter: brightness(1.08);\">\uc601\uc0c1 \uc81c\ucd9c\ud558\uae30 \u2192<\u002Fbutton>\n    <\u002Fform>\n  <\u002Fsection>\n\n  <footer style=\"max-width:1100px; margin:0 auto; padding:48px 24px 90px; text-align:center; border-top:1px solid rgba(255,255,255,0.1);\">\n    <div style=\"display:flex; justify-content:center; gap:24px; margin-bottom:20px; flex-wrap:wrap;\">\n      <a href=\"#\" style=\"color:rgba(255,255,255,0.55); text-decoration:none; font-size:13px;\">\uc774\uc6a9\uc57d\uad00<\u002Fa>\n      <a href=\"#\" style=\"color:rgba(255,255,255,0.55); text-decoration:none; font-size:13px;\">\uac1c\uc778\uc815\ubcf4\ucc98\ub9ac\ubc29\uce68<\u002Fa>\n      <a href=\"#\" style=\"color:rgba(255,255,255,0.55); text-decoration:none; font-size:13px;\">\uc800\uc791\uad8c \uc548\ub0b4<\u002Fa>\n      <a href=\"#\" style=\"color:rgba(255,255,255,0.55); text-decoration:none; font-size:13px;\">\ubb38\uc758\ud558\uae30<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"color:rgba(255,255,255,0.35); font-size:12px;\">\u00a9 2026 Suno AI Music Creation Event. All rights reserved.<\u002Fdiv>\n    <div style=\"color:rgba(255,255,255,0.3); font-size:12px; margin-top:10px;\">\uc81c\uc791\uc790: \uc7a5\ud558\ub9ac, \uc1a1\ubbfc\uc815, \uc624\uc815\ubbfc, \uc774\uc218\uc9c4<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\">\nconst FAQ_DATA = [\n  { q: 'SUNO\ub97c \ud55c \ubc88\ub3c4 \uc548 \uc368\ubd24\ub294\ub370 \ucc38\uc5ec\ud560 \uc218 \uc788\ub098\uc694?', a: \"\ub124. \ubb34\ub8cc \ud68c\uc6d0\uac00\uc785\ub9cc \uc644\ub8cc\ud55c \ub4a4 \uc6d0\ud558\ub294 \ubd84\uc704\uae30\ub97c \ud55c \uc904\ub85c \uc785\ub825\ud574 '\ub9cc\ub4e4\uae30'\ub97c \ub204\ub974\uba74 \uace1\uc774 \uc0dd\uc131\ub3fc\uc694. \uc804\ubb38\uc801\uc778 \uc74c\uc545 \uc9c0\uc2dd\uc744 \ud544\uc694\ub85c \ud558\uc9c0 \uc54a\uc544\uc694.\" },\n  { q: '\uc601\uc0c1 \uae38\uc774\ub098 \uc8fc\uc81c\uc5d0 \uc81c\ud55c\uc774 \uc788\ub098\uc694?', a: '\uc601\uc0c1 \uc8fc\uc81c\uc758 \uc81c\ud55c\uc740 \uc5c6\uc5b4\uc694. \ub2e4\ub9cc, \uae38\uc774\ub294 15~30\ucd08\ub97c \uad8c\uc7a5\ud558\uba70 \ucd5c\ub300 60\ucd08\uae4c\uc9c0 \ud5c8\uc6a9\ud574\uc694.' },\n  { q: '\uc5b4\ub5a4 \ud50c\ub7ab\ud3fc\uc5d0 \uc62c\ub824\uc57c \ud558\ub098\uc694?', a: '\uc720\ud29c\ube0c \uc1fc\uce20, \ud2f1\ud1a1, \uc778\uc2a4\ud0c0\uadf8\ub7a8 \ub9b4\uc2a4 \uc911 \ud76c\ub9dd\ud558\ub294 \ud50c\ub7ab\ud3fc\uc5d0 \uc5c5\ub85c\ub4dc\ud558\uc5ec \ucc38\uac00\uac00 \uac00\ub2a5\ud574\uc694. \uc5ec\ub7ec \ud50c\ub7ab\ud3fc\uc5d0 \uc5c5\ub85c\ub4dc \uac00\ub2a5\ud558\uba70, \ub3d9\uc77c\ud55c \uc601\uc0c1\uc77c \uacbd\uc6b0 \uc9c0\uc6d0\uc11c\uc5d0 \uc138 \uad70\ub370 \uc911 \ud55c \uacf3\uc758 \ub9c1\ud06c\ub9cc \uc785\ub825\ud574\uc8fc\uc138\uc694.' },\n  { q: '\uba87 \ubc88\uae4c\uc9c0 \uc751\ubaa8\ud560 \uc218 \uc788\ub098\uc694?', a: '1\uc778 \ucd5c\ub300 3\ud68c \uc751\ubaa8 \uac00\ub2a5\ud574\uc694. \ub2e4\ud68c \uc751\ubaa8 \uc2dc, \uc8fc\uc81c\uc640 BGM\uc774 \ubcf8\uc778\uc758 \ub2e4\ub978 \uc601\uc0c1\uacfc \uac19\uc544\uc11c\ub294 \uc548 \ub418\uba70, \ucc38\uac00 \ubcf4\uc0c1 \ud06c\ub808\ub527\uc740 \uc751\ubaa8 \ud69f\uc218\uc640 \ubb34\uad00\ud558\uac8c \uacc4\uc815\ub2f9 1\ud68c\ub9cc \uc9c0\uae09\ub3fc\uc694.' },\n  { q: '\uc2ec\uc0ac \uae30\uc900\uc774 \uad81\uae08\ud574\uc694.', a: '\uc0ac\uc6b4\ub4dc \uc644\uc131\ub3c4(40%), \uc601\uc0c1\uacfc\uc758 \uc870\ud654(35%), \ucc3d\uc758\uc131(25%)\uc744 \uae30\uc900\uc73c\ub85c \ub0b4\ubd80\uc5d0\uc11c \uc2ec\uc0ac\ud55c \uacb0\uacfc\uc5d0 \ub530\ub77c \uc21c\uc704\uac00 \uacb0\uc815\ub3fc\uc694. \uc870\ud68c\uc218\u00b7\uc88b\uc544\uc694\ub294 \ucc38\uace0 \uc9c0\ud45c\uac00 \ub420 \uc218 \uc788\uc73c\ub098 \uc808\ub300 \uae30\uc900\uc740 \uc544\ub2c8\uc5d0\uc694.' },\n  { q: '\ud06c\ub808\ub527\uacfc \uc774\uc6a9\uad8c\uc740 \uc5b8\uc81c \uc9c0\uae09\ub418\ub098\uc694?', a: '\ucc38\uac00 \ubcf4\uc0c1 \ud06c\ub808\ub527\uc740 \uacb0\uacfc \ubc1c\ud45c\uc77c\ub85c\ubd80\ud130 \uc601\uc5c5\uc77c \uae30\uc900 3\uc77c \uc774\ub0b4, \uc218\uc0c1 \ubcf4\uc0c1\uc740 \ubc1c\ud45c\uc77c\ub85c\ubd80\ud130 7\uc77c \uc774\ub0b4\uc5d0 \uc81c\ucd9c\ud558\uc2e0 \uc774\uba54\uc77c \uacc4\uc815\uc73c\ub85c \uc9c0\uae09\ub3fc\uc694.' },\n  { q: '\uadf8 \uc678 \ubb38\uc758\ub294 \uc5b4\ub514\ub85c \ud558\uba74 \ub418\ub098\uc694?', a: '\uc774\uba54\uc77c support@sunokorea.com\uc73c\ub85c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.' }\n];\n\nclass Component extends DCLogic {\n  state = { progress: 0, openFaq: 0, copiedHashtag: false, copiedMention: false, needsTap: false, shareMenuOpen: false, linkCopied: false };\n\n  setupReveal() {\n    this._revealEls = document.querySelectorAll('section');\n    this._revealEls.forEach(el => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(14px)';\n      el.style.transition = 'opacity 0.35s ease, transform 0.35s ease';\n    });\n    const loop = () => {\n      this.checkReveal();\n      const pending = [...this._revealEls].some(el => !el.dataset.revealed);\n      if (pending) requestAnimationFrame(loop);\n    };\n    loop();\n  }\n\n  checkReveal() {\n    if (!this._revealEls) return;\n    const vh = window.innerHeight;\n    this._revealEls.forEach(el => {\n      if (el.dataset.revealed) return;\n      const rect = el.getBoundingClientRect();\n      if (rect.top < vh * 1.05) {\n        el.style.opacity = '1';\n        el.style.transform = 'translateY(0)';\n        el.dataset.revealed = '1';\n      }\n    });\n  }\n\n  tryPlay() {\n    if (!this.videoEl) return;\n    this.videoEl.muted = true;\n    const p = this.videoEl.play();\n    if (p && p.catch) {\n      p.then(() => this.setState({ needsTap: false })).catch(() => this.setState({ needsTap: true }));\n    }\n  }\n\n  shareCopyLink() {\n    const url = window.location.href;\n    navigator.clipboard && navigator.clipboard.writeText(url).catch(() => {});\n    this.setState({ linkCopied: true });\n    clearTimeout(this._t_link);\n    this._t_link = setTimeout(() => this.setState({ linkCopied: false }), 1500);\n  }\n\n  shareToInstagram() {\n    const url = window.location.href;\n    navigator.clipboard && navigator.clipboard.writeText(url).catch(() => {});\n    window.open('https:\u002F\u002Fwww.instagram.com\u002F', '_blank', 'noopener');\n  }\n\n  copy(text, key) {\n    navigator.clipboard && navigator.clipboard.writeText(text).catch(() => {});\n    this.setState({ [key]: true });\n    clearTimeout(this['_t_' + key]);\n    this['_t_' + key] = setTimeout(() => this.setState({ [key]: false }), 1500);\n  }\n\n  componentDidMount() {\n    this.tryPlay();\n    this.setupReveal();\n    document.addEventListener('touchstart', this.tryPlay.bind(this), { once: true });\n    document.addEventListener('click', this.tryPlay.bind(this), { once: true });\n    this.onScroll = () => {\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY \u002F max)) : 0;\n      this.setState({ progress: p });\n      this.checkReveal();\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n  }\n\n  renderVals() {\n    const p = this.state.progress;\n    const scale = 1 + p * 0.4;\n    const translateY = p * -60;\n    const rotate = p * 3;\n    const opacity = 1 - p * 0.3;\n    const accent = '#A234C7';\n    const faqs = FAQ_DATA.map((f, i) => ({\n      q: f.q,\n      a: f.a,\n      open: this.state.openFaq === i,\n      sign: this.state.openFaq === i ? '\u2212' : '+',\n      toggle: () => this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i }))\n    }));\n    return {\n      accent,\n      faqs,\n      videoRef: (el) => { this.videoEl = el; if (el) this.tryPlay(); },\n      needsTap: this.state.needsTap,\n      shareMenuOpen: this.state.shareMenuOpen,\n      toggleShareMenu: () => this.setState(s => ({ shareMenuOpen: !s.shareMenuOpen })),\n      copyLink: () => this.shareCopyLink(),\n      copyLinkLabel: this.state.linkCopied ? '\ub9c1\ud06c \ubcf5\uc0ac\ub428!' : '\ub9c1\ud06c \ubcf5\uc0ac',\n      kakaoShareHref: 'https:\u002F\u002Fsharer.kakao.com\u002Ftalk\u002Ffriends\u002Fpicker\u002Flink?app_key=&url=' + encodeURIComponent(typeof window !== 'undefined' ? window.location.href : ''),\n      shareInstagram: () => this.shareToInstagram(),\n      hashtagLabel: this.state.copiedHashtag ? '\ubcf5\uc0ac\ub428!' : '#\uc218\ub178\uc20f\ud3fc\ucc4c\ub9b0\uc9c0',\n      mentionLabel: this.state.copiedMention ? '\ubcf5\uc0ac\ub428!' : '@suno_korea',\n      copyHashtag: () => this.copy('#\uc218\ub178\uc20f\ud3fc\ucc4c\ub9b0\uc9c0', 'copiedHashtag'),\n      copyMention: () => this.copy('@suno_korea', 'copiedMention'),\n      videoStyle: {\n        width: '100%',\n        height: '100vh',\n        objectFit: 'cover',\n        animation: 'fadeIn 1s ease',\n        transform: `scale(${scale}) translateY(${translateY}px) rotate(${rotate}deg)`,\n        opacity,\n        transition: 'transform 0.05s linear'\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
